<svg viewBox="0 0 1180 980" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrBlue" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2f6fb0"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2e8b6f"/>
    </marker>
    <marker id="arrGw" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b08d57"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="980" fill="#000000"/>

  <!-- ============ FORCING SECTION ============ -->
  <text x="60" y="48" fill="#8a8a8a" font-size="20">Forcing</text>
  <line x1="60" y1="62" x2="1120" y2="62" stroke="#555" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Precipitation -->
  <rect x="60" y="92" width="200" height="78" rx="10" fill="#fbe7c6" stroke="#d9a441" stroke-width="2"/>
  <text x="160" y="128" text-anchor="middle" fill="#7a5a16" font-size="22">Precipitation</text>
  <text x="160" y="152" text-anchor="middle" fill="#9a7320" font-size="16">Open-Meteo</text>

  <!-- ET -->
  <rect x="285" y="92" width="200" height="78" rx="10" fill="#fbe7c6" stroke="#d9a441" stroke-width="2"/>
  <text x="385" y="128" text-anchor="middle" fill="#7a5a16" font-size="22">ET (Penman)</text>
  <text x="385" y="152" text-anchor="middle" fill="#9a7320" font-size="16">Open-Meteo</text>

  <!-- Contributing catchment -->
  <rect x="680" y="92" width="380" height="78" rx="10" fill="#ece9e2" stroke="#9a968c" stroke-width="2"/>
  <text x="870" y="125" text-anchor="middle" fill="#444" font-size="22">Contributing catchment</text>
  <text x="870" y="152" text-anchor="middle" fill="#666" font-size="16">60,000 m², runoff coeff 0.75</text>

  <!-- Runoff arrow -->
  <line x1="870" y1="170" x2="870" y2="232" stroke="#2f6fb0" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="885" y="206" fill="#8a8a8a" font-size="16">Runoff</text>

  <!-- ============ WETLAND CELLS SECTION ============ -->
  <text x="60" y="252" fill="#8a8a8a" font-size="20">Wetland cells</text>
  <line x1="60" y1="266" x2="1120" y2="266" stroke="#555" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Top row: Cell 3, Cell 2, Cell 1 -->
  <!-- Cell 3 -->
  <rect x="270" y="300" width="200" height="110" rx="12" fill="#d6efe4" stroke="#8fc9b3" stroke-width="2"/>
  <text x="370" y="338" text-anchor="middle" fill="#1f5f48" font-size="22">Cell 3</text>
  <text x="370" y="368" text-anchor="middle" fill="#1f5f48" font-size="18">α = 289.77</text>
  <text x="370" y="392" text-anchor="middle" fill="#1f5f48" font-size="18">499 m²</text>

  <!-- Cell 2 -->
  <rect x="500" y="300" width="200" height="110" rx="12" fill="#d6efe4" stroke="#8fc9b3" stroke-width="2"/>
  <text x="600" y="338" text-anchor="middle" fill="#1f5f48" font-size="22">Cell 2</text>
  <text x="600" y="368" text-anchor="middle" fill="#1f5f48" font-size="18">α = 362.11</text>
  <text x="600" y="392" text-anchor="middle" fill="#1f5f48" font-size="18">604 m²</text>

  <!-- Cell 1 -->
  <rect x="730" y="300" width="200" height="110" rx="12" fill="#d6efe4" stroke="#8fc9b3" stroke-width="2"/>
  <text x="830" y="338" text-anchor="middle" fill="#1f5f48" font-size="22">Cell 1 (inlet)</text>
  <text x="830" y="368" text-anchor="middle" fill="#1f5f48" font-size="18">α = 558.75</text>
  <text x="830" y="392" text-anchor="middle" fill="#1f5f48" font-size="18">894 m²</text>
  <circle cx="940" cy="306" r="8" fill="#c0392b"/>
  <text x="958" y="312" fill="#8a8a8a" font-size="18">S1</text>

  <!-- Top-row surface flow arrows (right to left) -->
  <line x1="730" y1="355" x2="706" y2="355" stroke="#2e8b6f" stroke-width="2.5" marker-end="url(#arrGreen)"/>
  <line x1="500" y1="355" x2="476" y2="355" stroke="#2e8b6f" stroke-width="2.5" marker-end="url(#arrGreen)"/>

  <!-- Runoff feeds Cell 1 (from catchment) -->
  <line x1="870" y1="232" x2="870" y2="294" stroke="#2f6fb0" stroke-width="2.5"/>
  <path d="M870,294 L870,296 L830,296 L830,300" fill="none" stroke="#2f6fb0" stroke-width="2.5" marker-end="url(#arrBlue)"/>

  <!-- Cell 3 down to Cell 4 -->
  <line x1="370" y1="410" x2="370" y2="468" stroke="#2e8b6f" stroke-width="2.5" marker-end="url(#arrGreen)"/>

  <!-- Bottom row: Cell 4, Cell 5, Cell 6 -->
  <!-- Cell 4 -->
  <rect x="270" y="474" width="200" height="110" rx="12" fill="#d6efe4" stroke="#8fc9b3" stroke-width="2"/>
  <text x="370" y="512" text-anchor="middle" fill="#1f5f48" font-size="22">Cell 4</text>
  <text x="370" y="542" text-anchor="middle" fill="#1f5f48" font-size="18">α = 134.24</text>
  <text x="370" y="566" text-anchor="middle" fill="#1f5f48" font-size="18">236 m²</text>

  <!-- Cell 5 -->
  <rect x="500" y="474" width="200" height="110" rx="12" fill="#d6efe4" stroke="#8fc9b3" stroke-width="2"/>
  <text x="600" y="512" text-anchor="middle" fill="#1f5f48" font-size="22">Cell 5</text>
  <text x="600" y="542" text-anchor="middle" fill="#1f5f48" font-size="18">α = 190.00</text>
  <text x="600" y="566" text-anchor="middle" fill="#1f5f48" font-size="18">342 m²</text>

  <!-- Cell 6 -->
  <rect x="730" y="474" width="200" height="110" rx="12" fill="#d6efe4" stroke="#8fc9b3" stroke-width="2"/>
  <text x="830" y="512" text-anchor="middle" fill="#1f5f48" font-size="22">Cell 6 (outlet)</text>
  <text x="830" y="542" text-anchor="middle" fill="#1f5f48" font-size="18">α = 26.80</text>
  <text x="830" y="566" text-anchor="middle" fill="#1f5f48" font-size="18">49 m²</text>
  <circle cx="940" cy="480" r="8" fill="#c0392b"/>
  <text x="958" y="486" fill="#8a8a8a" font-size="18">S6</text>

  <!-- Bottom-row surface flow arrows (left to right) -->
  <line x1="470" y1="529" x2="494" y2="529" stroke="#2e8b6f" stroke-width="2.5" marker-end="url(#arrGreen)"/>
  <line x1="700" y1="529" x2="724" y2="529" stroke="#2e8b6f" stroke-width="2.5" marker-end="url(#arrGreen)"/>
  <text x="585" y="466" text-anchor="middle" fill="#8a8a8a" font-size="15">Wide channels (n = 0.035)</text>

  <!-- Cell 6 down to outlet weir -->
  <line x1="830" y1="584" x2="830" y2="636" stroke="#2f6fb0" stroke-width="2.5" marker-end="url(#arrBlue)"/>

  <!-- Outlet weir -->
  <rect x="700" y="642" width="260" height="78" rx="10" fill="#d6e6f8" stroke="#7aa7d4" stroke-width="2"/>
  <text x="830" y="676" text-anchor="middle" fill="#1c3f63" font-size="22">Outlet weir</text>
  <text x="830" y="702" text-anchor="middle" fill="#1c3f63" font-size="16">α = 33,000, β = 2.5</text>
  <circle cx="970" cy="648" r="8" fill="#c0392b"/>
  <text x="988" y="654" fill="#8a8a8a" font-size="18">Qout</text>

  <!-- Weir to receiving water -->
  <line x1="830" y1="720" x2="830" y2="772" stroke="#2f6fb0" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <rect x="700" y="778" width="260" height="62" rx="10" fill="#ece9e2" stroke="#9a968c" stroke-width="2"/>
  <text x="830" y="816" text-anchor="middle" fill="#444" font-size="22">Receiving water</text>

  <!-- ============ GROUNDWATER SECTION ============ -->
  <!-- Collector bus just above the GW box; all seepage drops land on it -->
  <line x1="305" y1="892" x2="675" y2="892" stroke="#b08d57" stroke-width="2" stroke-dasharray="2 4" opacity="0.6"/>

  <!-- Bottom-row cells drop straight from their lower edges -->
  <!-- Cell 4 -->
  <line x1="330" y1="584" x2="330" y2="888" stroke="#b08d57" stroke-width="2" stroke-dasharray="5 4"/>
  <!-- Cell 5 -->
  <line x1="600" y1="584" x2="600" y2="888" stroke="#b08d57" stroke-width="2" stroke-dasharray="5 4"/>
  <!-- Cell 6 -->
  <line x1="860" y1="584" x2="860" y2="640" stroke="#b08d57" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M860,640 L860,866 L670,866 L670,888" fill="none" stroke="#b08d57" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- Top-row cells exit downward through the gap between the two rows, hugging the left margin -->
  <!-- Cell 3 -->
  <path d="M290,410 L290,432 L300,432 L300,888" fill="none" stroke="#b08d57" stroke-width="2" stroke-dasharray="5 4"/>
  <!-- Cell 2 -->
  <path d="M520,410 L520,440 L370,440 L370,888" fill="none" stroke="#b08d57" stroke-width="2" stroke-dasharray="5 4"/>
  <!-- Cell 1 -->
  <path d="M750,410 L750,448 L630,448 L630,888" fill="none" stroke="#b08d57" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- Single arrow into the GW box from the bus -->
  <line x1="490" y1="892" x2="490" y2="908" stroke="#b08d57" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrGw)"/>

  <text x="660" y="850" fill="#b08d57" font-size="15" font-style="italic">seepage (K = 0.01 m/day)</text>

  <!-- Groundwater boundary box -->
  <rect x="310" y="910" width="360" height="64" rx="10" fill="#1c1408" stroke="#b08d57" stroke-width="2"/>
  <text x="490" y="938" text-anchor="middle" fill="#d9b276" font-size="20">Groundwater (fixed head)</text>
  <text x="490" y="960" text-anchor="middle" fill="#b08d57" font-size="15">head = −1.0 m</text>

  <!-- ============ LEGEND ============ -->
  <text x="60" y="652" fill="#8a8a8a" font-size="18">Sensors (assimilated):</text>
  <circle cx="72" cy="678" r="8" fill="#c0392b"/>
  <text x="90" y="684" fill="#8a8a8a" font-size="17">S1 = Cell 1 stage</text>
  <circle cx="72" cy="708" r="8" fill="#c0392b"/>
  <text x="90" y="714" fill="#8a8a8a" font-size="17">S6 = Cell 6 stage</text>
  <circle cx="72" cy="738" r="8" fill="#c0392b"/>
  <text x="90" y="744" fill="#8a8a8a" font-size="17">Qout = Outlet flow</text>

  <!-- groundwater legend -->
  <line x1="64" y1="776" x2="84" y2="776" stroke="#b08d57" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="92" y="782" fill="#8a8a8a" font-size="16">Surface–groundwater seepage</text>

  <text x="60" y="820" fill="#8a8a8a" font-size="16">HRT (mean age) in Cell 6: diagnostic only</text>
</svg>
