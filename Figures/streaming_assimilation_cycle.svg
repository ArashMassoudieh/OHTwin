<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b78"/>
    </marker>
    <marker id="aht" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a7526"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a97a2"/>
    </marker>
    <style>
      .lab   { font-size:12.5px; font-weight:700; text-anchor:middle; }
      .sub   { font-size:10px; text-anchor:middle; }
      .subi  { font-size:9.5px; text-anchor:middle; font-style:italic; }
      .flow  { stroke:#9a7526; stroke-width:1.6; fill:none; marker-end:url(#aht); }
      .rail  { stroke:#9a7526; stroke-width:1.5; fill:none; marker-end:url(#aht); stroke-dasharray:6 3; }
      .gray  { stroke:#8a97a2; stroke-width:1.4; fill:none; marker-end:url(#ahg); }
      .grayd { stroke:#8a97a2; stroke-width:1.4; fill:none; marker-end:url(#ahg); stroke-dasharray:5 3; }
      .ink   { stroke:#5b6b78; stroke-width:1.4; fill:none; marker-end:url(#ah); }
      .iconln{ stroke:#5c7386; stroke-width:1.4; fill:none; }
      .th    { stroke:#c0704a; stroke-width:1.2; stroke-dasharray:3 2; fill:none; }
      .bar   { fill:#c7b48a; }
    </style>
  </defs>

  <rect x="0" y="0" width="1120" height="660" fill="#ffffff"/>

  <!-- ================= LEFT COLUMN: forward-loop context ================= -->
  <!-- Sensor observation stream -->
  <rect x="24" y="70" width="228" height="54" rx="9" fill="#f6f7f8" stroke="#9aa7b0" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text class="lab" x="138" y="92" fill="#465059">Sensor observation stream</text>
  <text class="sub" x="138" y="110" fill="#5c6a75"><tspan font-style="italic">y</tspan><tspan baseline-shift="sub" font-size="8px">obs</tspan> &#183; record grows each cycle</text>
  <text class="subi" x="138" y="150" fill="#6c7a86">recency kernel w(&#948;) down-weights</text>
  <text class="subi" x="138" y="163" fill="#6c7a86">older observations</text>

  <!-- Forward simulation loop -->
  <rect x="24" y="200" width="228" height="90" rx="9" fill="#eaf1f8" stroke="#4a6fa5" stroke-width="1.5"/>
  <text class="lab" x="138" y="222" fill="#2c4a75">Forward simulation loop (&#916;)</text>
  <text class="sub" x="138" y="240" fill="#2c4a75">propagates posterior draws:</text>
  <text class="sub" x="138" y="254" fill="#2c4a75">nowcast + forecast, 95% bands</text>
  <text class="subi" x="138" y="276" fill="#4a6fa5">loop architecture: Shakouri et al. (2026)</text>

  <!-- Versioned snapshots -->
  <rect x="24" y="524" width="228" height="78" rx="9" fill="#eeeef5" stroke="#6a6a9a" stroke-width="1.5"/>
  <text class="lab" x="138" y="550" fill="#3d3d6b">Versioned on-disk snapshots</text>
  <text class="sub" x="138" y="568" fill="#3d3d6b">forward S(t) &#183; calibrated</text>
  <text class="sub" x="138" y="582" fill="#3d3d6b">S<tspan baseline-shift="sub" font-size="8px">cal</tspan> (&#952;&#770; + posterior draws)</text>

  <!-- forward <-> snapshots -->
  <path class="ink" d="M108,524 L108,292"/>
  <text x="99" y="408" text-anchor="middle" font-size="9px" fill="#5b6b78" transform="rotate(-90 99 408)">adopt S<tspan baseline-shift="sub" font-size="7px">cal</tspan> at next tick</text>
  <path class="ink" d="M168,292 L168,521"/>
  <text x="180" y="408" text-anchor="middle" font-size="9px" fill="#5b6b78" transform="rotate(-90 180 408)">write forward S(t)</text>

  <!-- obs -> warm start -->
  <path class="flow" d="M252,97 L266,97 L266,120 L296,120"/>
  <!-- snapshot -> warm start (reload baseline) -->
  <path class="rail" d="M252,556 L270,556 L270,136 L296,136"/>
  <text x="262" y="470" text-anchor="middle" font-size="9px" fill="#9a7526" transform="rotate(-90 262 470)">reload model baseline</text>
  <!-- publish -> snapshots (write) -->
  <path class="ink" d="M296,566 L254,566"/>

  <!-- ================= CENTER: assimilation cycle ================= -->
  <rect x="280" y="40" width="500" height="584" rx="10" fill="#fbf5e8" stroke="#b07d2b" stroke-width="1.7"/>
  <text x="530" y="64" text-anchor="middle" font-size="14" font-weight="700" fill="#7a5a17">Streaming MCMC assimilation &#8212; cycle k</text>
  <text x="530" y="81" text-anchor="middle" font-size="10.5px" font-style="italic" fill="#7a5a17">period &#916;<tspan baseline-shift="sub" font-size="8px">cal</tspan> &#183; hard wall-clock budget B</text>

  <!-- warm start -->
  <rect x="300" y="92" width="456" height="58" rx="7" fill="#faf3e3" stroke="#b07d2b" stroke-width="1.3"/>
  <text class="lab" x="528" y="112" fill="#5c440f">Warm start</text>
  <text class="sub" x="528" y="129" fill="#5c440f">chain states {&#952;<tspan baseline-shift="super" font-size="7.5px">(c)</tspan>} &amp; proposal scales from cycle k&#8722;1;</text>
  <text class="sub" x="528" y="143" fill="#5c440f">model baseline reloaded from latest snapshot</text>

  <!-- sampling -->
  <rect x="300" y="174" width="456" height="64" rx="7" fill="#faf3e3" stroke="#b07d2b" stroke-width="1.3"/>
  <text class="lab" x="510" y="196" fill="#5c440f">Multi-chain Metropolis sampling</text>
  <text class="sub" x="510" y="213" fill="#5c440f">chain-private model copies; wall-clock-bounded sweeps;</text>
  <text class="sub" x="510" y="227" fill="#5c440f">kernel-weighted posterior over the growing record</text>
  <path class="iconln" d="M690,214 L698,208 L706,211 L714,204 L722,207 L730,202"/>
  <circle cx="716" cy="196" r="7" fill="none" stroke="#5c7386" stroke-width="1.2"/>
  <path class="iconln" d="M716,196 L716,192 M716,196 L719,198"/>

  <!-- plateau classifier -->
  <rect x="300" y="264" width="456" height="64" rx="7" fill="#faf3e3" stroke="#b07d2b" stroke-width="1.3"/>
  <text class="lab" x="510" y="286" fill="#5c440f">Per-chain plateau classifier</text>
  <text class="sub" x="510" y="303" fill="#5c440f">trajectory-based burn-in exclusion; sweep-adaptive window,</text>
  <text class="sub" x="510" y="317" fill="#5c440f">stagnation guard, hysteresis</text>
  <path class="iconln" d="M688,318 L700,308 L710,300 L722,297 L734,296"/>
  <path class="th" d="M688,296 L734,296"/>

  <!-- pool -->
  <rect x="300" y="354" width="456" height="56" rx="7" fill="#faf3e3" stroke="#b07d2b" stroke-width="1.3"/>
  <text class="lab" x="510" y="376" fill="#5c440f">Pool post-plateau samples</text>
  <text class="sub" x="510" y="394" fill="#5c440f">posterior medians, 95% credible intervals, Geyer ESS</text>
  <rect class="bar" x="690" y="388" width="8" height="10"/>
  <rect class="bar" x="701" y="382" width="8" height="16"/>
  <rect class="bar" x="712" y="379" width="8" height="19"/>
  <rect class="bar" x="723" y="385" width="8" height="13"/>
  <rect class="bar" x="734" y="391" width="8" height="7"/>

  <!-- certification gate diamond -->
  <polygon points="430,470 528,438 626,470 528,502" fill="#f1e2c1" stroke="#b07d2b" stroke-width="1.5"/>
  <text x="528" y="466" text-anchor="middle" font-size="12" font-weight="700" fill="#5c440f">Certification</text>
  <text x="528" y="482" text-anchor="middle" font-size="12" font-weight="700" fill="#5c440f">gate</text>

  <!-- publish -->
  <rect x="300" y="528" width="456" height="56" rx="7" fill="#faf3e3" stroke="#b07d2b" stroke-width="1.3"/>
  <text class="lab" x="528" y="550" fill="#5c440f">Publish (cycle end)</text>
  <text class="sub" x="528" y="568" fill="#5c440f">calibrated snapshot &#952;&#770;, parameter-CI rows, posterior samples</text>

  <!-- pipeline arrows -->
  <path class="flow" d="M528,150 L528,172"/>
  <path class="flow" d="M528,238 L528,262"/>
  <path class="flow" d="M528,328 L528,352"/>
  <path class="flow" d="M528,410 L528,436"/>
  <path class="flow" d="M528,502 L528,526"/>
  <text x="540" y="521" text-anchor="start" font-size="9px" fill="#9a7526" font-style="italic">certified or provisional (flagged)</text>

  <!-- loop-back rail -->
  <path class="rail" d="M300,556 L288,556 L288,120 L298,120"/>
  <text x="282" y="338" text-anchor="middle" font-size="9px" fill="#9a7526" transform="rotate(-90 282 338)">terminal ensemble + proposal scales seed cycle k+1</text>

  <!-- ================= RIGHT COLUMN: by-products + gate outcomes ================= -->
  <!-- realization reservoir -->
  <rect x="804" y="176" width="292" height="72" rx="9" fill="#f2f3f4" stroke="#8a97a2" stroke-width="1.4"/>
  <text class="lab" x="950" y="200" fill="#46505a">Realization reservoir</text>
  <text class="sub" x="950" y="218" fill="#5c6a75">uniform sample of N output trajectories</text>
  <text class="sub" x="950" y="232" fill="#5c6a75">captured during sampling (no extra solves)</text>
  <path class="grayd" d="M756,206 L801,206"/>

  <!-- predictive band -->
  <rect x="804" y="292" width="292" height="72" rx="9" fill="#f2f3f4" stroke="#8a97a2" stroke-width="1.4"/>
  <text class="lab" x="950" y="316" fill="#46505a">95% posterior-predictive band</text>
  <text class="sub" x="950" y="334" fill="#5c6a75">appended over the cycle's incremental window;</text>
  <text class="sub" x="950" y="348" fill="#5c6a75">continuous ribbon across cycles</text>
  <path class="gray" d="M950,248 L950,289"/>

  <!-- certification gate outcomes inset -->
  <rect x="804" y="408" width="292" height="196" rx="9" fill="#ffffff" stroke="#b07d2b" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="820" y="430" font-size="12" font-weight="700" fill="#5c440f">Certification gate &#8212; outcomes</text>
  <text x="820" y="446" font-size="9.5px" font-style="italic" fill="#8a6a2a">two sequential tests label the pooled samples</text>

  <circle cx="822" cy="470" r="5" fill="#3f8f6b"/>
  <text x="836" y="468" font-size="10.5px" font-weight="700" fill="#276448">certified &#183; within-cycle quorum</text>
  <text x="836" y="482" font-size="9.5px" fill="#4a5560">plateaued fraction <tspan font-style="italic">f</tspan><tspan baseline-shift="sub" font-size="7.5px" font-style="italic">P</tspan> &#8805; <tspan font-style="italic">q</tspan></text>

  <circle cx="822" cy="512" r="5" fill="#3f7fb0"/>
  <text x="836" y="510" font-size="10.5px" font-weight="700" fill="#285a80">certified &#183; inter-cycle stability</text>
  <text x="836" y="524" font-size="9.5px" fill="#4a5560">estimate stable over <tspan font-style="italic">W</tspan> cycles &amp; <tspan font-style="italic">f</tspan><tspan baseline-shift="sub" font-size="7.5px" font-style="italic">P</tspan> &#8805; <tspan font-style="italic">f</tspan><tspan baseline-shift="sub" font-size="7.5px" font-style="italic">min</tspan></text>

  <circle cx="822" cy="554" r="5" fill="#c39a4e"/>
  <text x="836" y="552" font-size="10.5px" font-weight="700" fill="#8a6520">provisional</text>
  <text x="836" y="566" font-size="9.5px" fill="#4a5560">otherwise &#8212; published flagged (uncertified width)</text>

  <!-- gate -> outcomes leader -->
  <path d="M626,470 L804,470" stroke="#b07d2b" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/>
</svg>
