<script type="text/javascript">
// Loading splash for the OHTwin WASM viewer. Exposes window.dtSplash so the Qt
// loader can drive it: setProgress(0..100) and done(). Until Qt reports real
// progress the bar creeps toward a ceiling, then snaps to 100 on load.
(function () {
  var STAGES = [[0,'Initialising runtime'],[12,'Fetching WebAssembly module'],
                [38,'Compiling module'],[62,'Loading OpenHydroQual engine'],
                [80,'Connecting sensor stream'],[93,'Assimilating latest state'],
                [100,'Ready']];
  var pct = 0, done = false, timer = null;
  var shell  = function () { return document.getElementById('dt-shell'); };
  var bar    = function () { return document.getElementById('dt-bar'); };
  var status = function () { return document.getElementById('dt-status'); };
  var pctEl  = function () { return document.getElementById('dt-pct'); };

  function label(p) { var t = STAGES[0][1];
    for (var i = 0; i < STAGES.length; i++) if (p >= STAGES[i][0]) t = STAGES[i][1];
    return t; }

  function paint() {
    var b = bar(), s = status(), q = pctEl();
    if (b) b.style.width = pct.toFixed(1) + '%';
    if (s) s.textContent = label(pct);
    if (q) q.textContent = String(Math.floor(pct)).padStart(3, '0') + '%';
  }

  var ceilings = [30, 55, 74, 88, 96, 99], ci = 0;
  function creep() {
    timer = setInterval(function () {
      if (done) return;
      var cap = ceilings[Math.min(ci, ceilings.length - 1)];
      var next = Math.min(cap, pct + Math.random() * 3.2);
      if (next >= cap - 0.4) ci++;
      pct = next; paint();
    }, 220);
  }

  window.dtSplash = {
    setProgress: function (p) {
      pct = Math.max(0, Math.min(100, Number(p) || 0)); paint();
    },
    done: function () {
      done = true; pct = 100; paint();
      if (timer) clearInterval(timer);
      var sh = shell();
      if (sh) sh.style.opacity = 0;   // 600ms fade, per the design
    },
    reset: function () {
      done = false; pct = 0; ci = 0; paint();
      var sh = shell(); if (sh) sh.style.opacity = 1;
      if (!timer) creep();
    }
  };
  paint(); creep();
})();
</script>
